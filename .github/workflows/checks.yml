name: Provjere aplikacije
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://supabase.build.test
      VITE_SUPABASE_ANON_KEY: fixture-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Provjera zapakirane gamercard funkcije
        run: node tests/app/libraryShare.package.mjs
      - name: Provjera Netlify dijeljenja
        run: node tests/app/libraryShare.netlify.mjs
