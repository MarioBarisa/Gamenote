[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/rawg/*"
  to = "https://api.rawg.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200

[[edge_functions]]
  path = "/shared"
  function = "og-shared"

[functions."library-card"]
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["netlify/functions/lib/fonts/**", "netlify/functions/lib/card-renderer/**"]

[[edge_functions]]
  path = "/:username"
  function = "og-library"
